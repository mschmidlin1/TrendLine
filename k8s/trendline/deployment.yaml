apiVersion: apps/v1
kind: Deployment
metadata:
  name: trendline
  namespace: trendline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trendline
  template:
    metadata:
      labels:
        app: trendline
    spec:
      containers:
        - name: app
          image: ghcr.io/mschmidlin1/trendline-algo:latest
          envFrom:
            - secretRef:
                name: trendline-env
          env:
            - name: POSTGRES_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OLLAMA_HOST
              value: "http://$(POSTGRES_HOST):11434"